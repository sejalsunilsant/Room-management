spring.application.name=room-management-backend

# Load .env file (supports running from root folder or room-management-backend folder)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Supabase / PostgreSQL Database Configuration
# These retrieve from .env variables (e.g. DB_URL or SPRING_DATASOURCE_URL)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:your-supabase-password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations
app.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3VwZXItbG9uZy1zZWNyZXQta2V5LWZvci1yb29tLW1hbmFnZW1lbnQtYXBwbGljYXRpb24tcHJvZHVjdGlvbi1yZWFkeQ==}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=INFO
