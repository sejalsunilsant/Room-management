name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ===================================================
  # 1. Backend CI (Spring Boot / Java 21 / Maven)
  # ===================================================
  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Spring Boot Application
        working-directory: room-management-backend
        run: mvn -B clean package -DskipTests

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: room-management-backend/target/*.jar
          retention-days: 7

  # ===================================================
  # 2. Frontend CI (React / Vite / Node 20)
  # ===================================================
  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: room-management-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: room-management-frontend
        run: npm ci

      - name: Run Linter
        working-directory: room-management-frontend
        run: npm run lint

      - name: Build Production Frontend
        working-directory: room-management-frontend
        env:
          VITE_API_BASE_URL: https://room-management-nlk2.onrender.com
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: room-management-frontend/dist/
          retention-days: 7

  # ===================================================
  # 3. Deployment Trigger (Main branch only)
  # ===================================================
  deploy:
    name: Trigger Deployments
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to Render (via Deploy Hook if configured)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render deployment hook..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "Render deploy triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Render will use its GitHub webhook auto-deploy."
          fi

      - name: Deployment Info
        run: |
          echo "=========================================="
          echo "CI/CD checks passed successfully!"
          echo "Frontend: Automatically deployed via Vercel GitHub integration (https://stroommangment.vercel.app)"
          echo "Backend: Deployed on Render (https://room-management-nlk2.onrender.com)"
          echo "=========================================="
